# One-off: copy everything in the Google Sheet into Upstash Redis
# (scripts/import-sheet.mjs). Run it from the Actions tab: "dry run" reads
# the Sheet and reports what it would save; "write" saves it and checks it.
# Safe to run again: each day's snapshots are merged, not replaced.
name: Import the Google Sheet

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run only reports; write saves to Upstash'
        type: choice
        options: [dry-run, write]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: import-sheet

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/import-sheet.mjs
        env:
          MODE: ${{ inputs.mode }}
          SHEET_EXPORT_KEY: ${{ secrets.SHEET_EXPORT_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
