# Monthly (the 2nd, with the 15th as a second chance): reads CalMac's latest
# reliability figures into Redis and works the thresholds out again
# (scripts/jobs/reliability/).
name: Monthly

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'live saves the figures; dry only reports what would change'
        type: choice
        options: [live, dry]
        default: live
  schedule:
    - cron: '41 8 2,15 * *'

permissions:
  contents: read

concurrency:
  group: job-monthly-${{ github.ref_name }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/jobs/reliability/package-lock.json
      - run: npm ci --prefix scripts/jobs/reliability --ignore-scripts
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/jobs/register.mjs scripts/jobs/reliability/index.mjs
        env:
          MODE: ${{ inputs.mode || 'live' }}
          # From main: production. From any other branch (dev): the dev database
          # and no CRON_SECRET, so nothing can be sent
          SITE: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          UPSTASH_REDIS_REST_URL: ${{ github.ref_name == 'main' && secrets.UPSTASH_REDIS_REST_URL || secrets.DEV_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ github.ref_name == 'main' && secrets.UPSTASH_REDIS_REST_TOKEN || secrets.DEV_UPSTASH_REDIS_REST_TOKEN }}
          CRON_SECRET: ${{ github.ref_name == 'main' && secrets.CRON_SECRET || '' }}
