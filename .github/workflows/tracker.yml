# Every 15 minutes: the per-sailing prediction log and the status-and-weather
# snapshots (scripts/jobs/tracker.mjs). Started by cron-job.org through
# GitHub's API; the hourly schedule is a fallback, skipped while cron-job.org
# is starting it.
name: Tracker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry saves nothing'
        type: choice
        options: [live, dry]
        default: live
  schedule:
    - cron: '11 * * * *'

permissions:
  contents: read

concurrency:
  group: job-tracker-${{ github.ref_name }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --import ./scripts/jobs/register.mjs scripts/jobs/tracker.mjs
        env:
          MODE: ${{ inputs.mode || 'live' }}
          # From main: production. From any other branch (dev): the dev database
          # and no CRON_SECRET, so nothing can be sent
          SITE: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          UPSTASH_REDIS_REST_URL: ${{ github.ref_name == 'main' && secrets.UPSTASH_REDIS_REST_URL || secrets.DEV_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ github.ref_name == 'main' && secrets.UPSTASH_REDIS_REST_TOKEN || secrets.DEV_UPSTASH_REDIS_REST_TOKEN }}
          CRON_SECRET: ${{ github.ref_name == 'main' && secrets.CRON_SECRET || '' }}
